seed: 42
output_dir: outputs/diff2d
# By-patient holdout fractions (multi-patient runs). Test patients are excluded
# from BOTH train and val. These mirror the train script CLI defaults
# (--val_fraction / --test_fraction), which remain the source of truth at runtime.
val_fraction: 0.2
test_fraction: 0.1
slice_manifest: data/training/slices.jsonl
batch_size: 16
num_workers: 4
learning_rate: 1.0e-4
max_epochs: 200
# latent_channels / in_channels(2C) / out_channels(C) are runtime-overridden from
# the AE checkpoint; mirrored here for clarity (B2: latent_channels 8 -> in 16/out 8).
latent_channels: 8
# Generative formulation:
#   "epsilon" (default): latent diffusion -- sampling starts from N(0,1) noise with
#     the NAC latent as a concat condition (uses cond_dropout_prob + latent_scale +
#     perceptual_weight + the DDIM sampler).
#   "flow": NAC->AC rectified-flow BRIDGE (I2SB-style) -- the trajectory starts FROM the
#     NAC latent so the model cannot ignore it (structurally fixes conditioning collapse).
#     NAC is the bridge ENDPOINT, NOT a concat channel (in_channels = C, not 2C): feeding
#     it as a channel too would let the net recover AC=(x_t - tau*NAC)/(1-tau) by algebra.
#     In flow mode cond_dropout_prob, latent_scale and Min-SNR (snr_gamma) are auto-disabled
#     and guidance_scale is N/A (no null condition); perceptual_weight is NOT disabled in
#     diff2d (only ft3d zeroes it) -- it applies to the velocity AC estimate (x_t - tau*v).
#     The flow_sample integrator (linear tau grid, no noise / no clip_x0) is used at inference.
#     See docs/nac_ac_benchmark.md §6.
prediction_type: epsilon
# Classifier-free guidance (InstructPix2Pix-style). During training the NAC
# conditioning latent is replaced by zeros (the "null" condition) with this
# per-sample probability, so the UNet learns BOTH the conditional and
# unconditional score; inference then amplifies the conditional direction with
# --guidance_scale. 0 disables (plain conditional training). Required because
# plain channel-concat conditioning is otherwise ignored (see docs/nac_ac_benchmark.md §5).
cond_dropout_prob: 0.1
# Stable-Diffusion-style latent normalization: encode multiplies the raw AE latent
# by this scale, decode divides by it, so diffusion operates on ~unit-std latents
# (matching the DDIM sampler's N(0,1) start). null = compute it once at the start of
# training as 1/std over a sample of AC latents and embed it in the checkpoint. Set a
# positive number to pin the value (e.g. to resume deterministically).
latent_scale: null
model:
  spatial_dims: 2
  in_channels: 16
  out_channels: 8
  num_channels: [64, 128, 256]
  attention_levels: [false, true, true]
loss:
  noise_mse_weight: 1.0
  recon_l1_weight: 1.0
# Perceptual loss on the in-graph decoded x0 estimate (frozen VGG by default).
# >0 enables it; 0 disables (no-op). Backend pluggable: "vgg" now, "medical_sam" later.
perceptual_weight: 0.1
# Apply the perceptual term only to low-noise (high-SNR) timesteps t<frac*T, where the
# one-step x0 estimate is meaningful (t=0 is high SNR here); see PixelGen.
perceptual_active_frac: 0.7
perceptual_backend: vgg
# Geometric-only data augmentation (no intensity transforms). Disabled by default.
# Applied to TRAIN pairs only, with the SAME random geometry on NAC and AC (val clean).
augment:
  enabled: true
  flip_prob: 0.5          # per spatial axis (H, W)
  rot90_prob: 0.5         # 90-degree rotations in the H-W plane
  affine_prob: 0.3        # mild rotate/scale/translate
  affine_rotate_deg: 5.0
  affine_scale: 0.05
  affine_translate: 0.02  # fraction of axis length
