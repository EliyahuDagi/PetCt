seed: 42
output_dir: outputs/ft3d
volume_manifest: data/training/volumes.jsonl
batch_size: 1
grad_accum_steps: 16
num_workers: 2
learning_rate: 5.0e-5
max_epochs: 150
latent_channels: 4
model:
  spatial_dims: 3
  in_channels: 4
  out_channels: 4
  num_channels: [64, 128, 256]
  attention_levels: [false, true, true]
loss:
  noise_mse_weight: 1.0
  recon_l1_weight: 1.0
  perceptual_l1_weight: 0.1
