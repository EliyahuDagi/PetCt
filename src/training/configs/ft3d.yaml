seed: 42
output_dir: outputs/ft3d
# By-patient holdout fractions (multi-patient runs). Test patients are excluded
# from BOTH train and val. These mirror the train script CLI defaults
# (--val_fraction / --test_fraction), which remain the source of truth at runtime.
val_fraction: 0.2
test_fraction: 0.1
volume_manifest: data/training/volumes.jsonl
batch_size: 1
grad_accum_steps: 16
num_workers: 2
learning_rate: 5.0e-5
max_epochs: 150
# latent_channels / in_channels(2C) / out_channels(C) are runtime-overridden from
# the 3D AE checkpoint; mirrored here for clarity (B2: latent_channels 8 -> in 16/out 8).
latent_channels: 8
# Stable-Diffusion-style latent normalization: encode multiplies the raw 3D-AE latent
# by this scale, decode divides by it, so diffusion operates on ~unit-std latents
# (matching the DDIM sampler's N(0,1) start). null = compute it once at the start of
# training as 1/std over a sample of AC latents and embed it in the checkpoint. Set a
# positive number to pin the value (e.g. to resume deterministically).
latent_scale: null
model:
  spatial_dims: 3
  in_channels: 16
  out_channels: 8
  num_channels: [64, 128, 256]
  attention_levels: [false, true, true]
loss:
  noise_mse_weight: 1.0
  recon_l1_weight: 1.0
# Perceptual loss on the in-graph decoded x0 estimate; 2D backbone run slice-wise
# on the 3D decode (frozen VGG by default). Reconciles the old perceptual_l1_weight
# stub. >0 enables; 0 disables (no-op). Backend pluggable: "vgg" / "medical_sam".
perceptual_weight: 0.1
perceptual_backend: vgg
# Geometric-only 3D data augmentation (no intensity transforms). Disabled by default;
# layered on top of the existing crop/flip/rot90. Applied to TRAIN pairs only, with
# the SAME random geometry on NAC and AC (val stays clean).
augment:
  enabled: true
  flip_prob: 0.5             # per spatial axis (D, H, W)
  rot90_prob: 0.5            # 90-degree rotations in the axial (H-W) plane
  affine_prob: 0.3           # mild rotate/scale/translate
  affine_rotate_deg: 7.0
  affine_scale: 0.1
  affine_translate: 0.02     # fraction of axis length
  elastic_prob: 0.0          # very-mild elastic; off by default
  elastic_sigma_range: [1.0, 2.0]
  elastic_magnitude_range: [1.0, 2.0]
