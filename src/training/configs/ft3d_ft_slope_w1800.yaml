# FINE-TUNE ABLATION ARM: slope_w1800  (weight sweep)
#
# Short fine-tune from the best existing 3D flow model (ft3d_flow_p/best.pt, passed via
# --init_from) rather than a from-scratch run: it isolates what each loss change DOES to an
# already-good model, in ~1/20th of the compute.
#
# INVARIANTS across every arm (so the ablation is single-variable):
#   --init_from   outputs/ft3d_flow_p/best.pt     same starting weights
#   --split_json  outputs/ft3d_flow_p/split.json  same partition -> leak-free paired eval
#                 (REQUIRED: the same seed does NOT reproduce a split across runs)
#   batch_size 4 x grad_accum 4                   matched batching, effective batch 16
#   learning_rate 1e-5                            5x below the 5e-5 the baseline trained at,
#                                                 because we are refining, not training
# The 'control' arm changes NOTHING else, so it measures the effect of fine-tuning and
# batching alone -- without it none of the other arms is attributable.
#
#
# WEIGHT SWEEP POINT: quant_weight = 1800 (36x the calibrated 50).
#
# Why sweep: at weight 50 (~5% of the velocity MSE) the slope penalty moved reg_slope on
# 41/41 patients -- the mechanism demonstrably works -- but closed only ~1.7% of the 0.158
# gap to 1.0. Every other mechanism tried (intensity weighting, expectile, U-shaped tau,
# LPL) was inert at the same share, which says the dominant MSE simply re-establishes the
# conditional mean. So the question is not WHICH term but HOW HARD.
#
# Measured exchange rate at weight 50: +0.59 reg_slope per dB of PSNR -- ~4.5x more
# efficient than post-hoc affine recalibration (+0.13/dB). Naively, closing the whole gap
# costs ~0.27 dB. That rate WILL degrade as the weight grows; finding where is the point.
# The top of the sweep is deliberately past the expected breaking point: at 5400 the term
# is several times the MSE, which is how the original VGG perceptual attempt failed (it ran
# 5-7x the recon loss). An arm that degrades here is a useful bracket, not a wasted run.
#
# WHAT THIS ABLATION TARGETS: the measured under-dispersion of the baseline --
#   reg_slope 0.844 (want 1.0), reg_intercept +0.057, hot_band_rel_error -0.10
# i.e. high uptake is compressed ~16% and hot tissue under-estimated ~10%. This is the
# MSE optimum (the conditional mean is less extreme than the truth), not a bug, so it can
# only be fixed by changing the objective. See src/training/utils/quant_losses.py.
#
# SLOPE PENALTY (my top pick): penalizes the fitted slope of pred-on-gt deviating
# from 1, i.e. optimizes the exact statistic that is broken, plus a variance-matching term
# so it cannot satisfy the slope while staying over-smooth.
# weight 50 = ~5% of the velocity MSE, measured on the trained model (_diag_lpl_calibrate).
seed: 42
output_dir: outputs/ft3d_ft_slope_w1800
val_fraction: 0.2
test_fraction: 0.1
volume_manifest: data/training/volumes.jsonl
batch_size: 4
grad_accum_steps: 4
num_workers: 4
learning_rate: 1.0e-5
max_epochs: 150
latent_channels: 8
prediction_type: flow
latent_scale: 1.0
inflate_freeze_backbone: false
inflate_unfreeze_step: 0
perceptual_weight: 0.0
quant_loss: slope
quant_weight: 1800.0
quant_variance_weight: 0.5
flow_tau_dist: uniform
flow_loss_weighting: none
model:
  spatial_dims: 3
  in_channels: 8
  out_channels: 8
  num_channels: [64, 128, 256]
  attention_levels: [false, true, true]
loss:
  noise_mse_weight: 1.0
  recon_l1_weight: 1.0
augment:
  enabled: true
  flip_prob: 0.5
  rot90_prob: 0.5
  affine_prob: 0.3
  affine_rotate_deg: 7.0
  affine_scale: 0.1
  affine_translate: 0.02
  elastic_prob: 0.0
  elastic_sigma_range: [1.0, 2.0]
  elastic_magnitude_range: [1.0, 2.0]
